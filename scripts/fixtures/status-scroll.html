<link rel="stylesheet" href="/src/styles/app.css">
<style>.app-frame{display:flex}.main-pane{flex:1}.app-titlebar{height:48px;flex:none}.topbar{height:50px;flex:none}.ProseMirror{font:20px/1.7 Arial} .title-shell{height:100px;flex:none}</style>
<div class="app-shell"><header class="app-titlebar">Title bar</header><div class="app-frame"><main class="main-pane"><div class="topbar">Editor toolbar</div><section class="note-surface"><div class="title-shell">Note title</div><div class="editor-shell"><div id="editor"></div></div></section></main></div></div>
<script type="module">
import {Editor} from '@tiptap/core';import StarterKit from '@tiptap/starter-kit';import {BulletMethodMarkers} from '/src/editor/bulletMethodMarkers.ts';
window.editor=new Editor({element:document.querySelector('#editor'),extensions:[StarterKit,BulletMethodMarkers],editorProps:{scrollThreshold:{top:32,right:8,bottom:160,left:8},scrollMargin:{top:56,right:8,bottom:220,left:8}},content:'<ul><li><p>IN PROGRESS: First task</p></li><li><p>TODO: Second task</p></li></ul>'+Array.from({length:35},(_,i)=>`<p>More content ${i}</p>`).join('')});
editor.view.dispatch(editor.state.tr.setMeta('bulletMethodDisplay',{enabled:true,replaceBullets:true}));
</script>
