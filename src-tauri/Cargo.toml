[package]
name = "lumen-notes"
version = "0.1.0"
description = "A simple, beautiful, file-native desktop notes app."
authors = ["Lumen Notes contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "6"
pulldown-cmark = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros"] }
